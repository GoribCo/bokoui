name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE: /bokoui
  NPM: --registry=https://registry.npmjs.org/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and pack the library
        working-directory: packages/bokoui
        run: |
          sed -i 's#http://127.0.0.1:4873/#https://registry.npmjs.org/#g' package-lock.json
          npm ci $NPM
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Landing page
        run: |
          mkdir site
          cp examples/showcase/index.html examples/showcase/.nojekyll site/
      - name: React (Next.js)
        working-directory: examples/next-js
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE }}/react
          NEXT_PUBLIC_BOKOUI_URL_REACT: ${{ env.BASE }}/react
          NEXT_PUBLIC_BOKOUI_URL_VUE: ${{ env.BASE }}/vue
          NEXT_PUBLIC_BOKOUI_URL_EXPO: ${{ env.BASE }}/expo
        run: |
          rm -f package-lock.json
          npm pkg set dependencies.bokoui="file:$(echo "$RUNNER_TEMP"/bokoui-*.tgz)"
          npm install $NPM
          npm run build
          cp -r out ../../site/react
      - name: Vue (Nuxt)
        working-directory: examples/nuxt-js
        env:
          NUXT_APP_BASE_URL: ${{ env.BASE }}/vue/
          NUXT_PUBLIC_URL_REACT: ${{ env.BASE }}/react
          NUXT_PUBLIC_URL_VUE: ${{ env.BASE }}/vue
          NUXT_PUBLIC_URL_EXPO: ${{ env.BASE }}/expo
        run: |
          rm -f package-lock.json
          npm pkg set dependencies.bokoui="file:$(echo "$RUNNER_TEMP"/bokoui-*.tgz)"
          npm install $NPM
          npx nuxt generate
          cp -r .output/public ../../site/vue
      - name: Expo (web)
        working-directory: examples/expo-js
        env:
          EXPO_BASE_URL: ${{ env.BASE }}/expo
          EXPO_PUBLIC_BOKOUI_URL_REACT: ${{ env.BASE }}/react
          EXPO_PUBLIC_BOKOUI_URL_VUE: ${{ env.BASE }}/vue
          EXPO_PUBLIC_BOKOUI_URL_EXPO: ${{ env.BASE }}/expo
        run: |
          rm -f package-lock.json
          npm pkg set dependencies.bokoui="file:$(echo "$RUNNER_TEMP"/bokoui-*.tgz)"
          npm install $NPM
          npx expo export --platform web
          cp -r dist ../../site/expo
      - name: Next.js layouts (static demo)
        working-directory: examples/next-js-layouts
        env:
          NEXT_PUBLIC_DEMO: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE }}/next-layouts
        run: |
          rm -f package-lock.json
          npm pkg set dependencies.bokoui="file:$(echo "$RUNNER_TEMP"/bokoui-*.tgz)"
          npm install $NPM
          node scripts/prepare-static.mjs
          npx next build
          cp -r out ../../site/next-layouts
      - name: Expo layouts (web)
        working-directory: examples/expo-js-layouts
        continue-on-error: true
        env:
          EXPO_BASE_URL: ${{ env.BASE }}/expo-layouts
        run: |
          rm -f package-lock.json
          npm pkg set dependencies.bokoui="file:$(echo "$RUNNER_TEMP"/bokoui-*.tgz)"
          npm install $NPM
          npx expo export --platform web
          cp -r dist ../../site/expo-layouts
      # The demos' component pages are the docs; /<platform>/docs/ points at them.
      - name: Docs entry points
        run: |
          for p in react vue expo; do
            mkdir -p site/$p/docs
            echo "<!doctype html><meta charset=utf-8><meta http-equiv=refresh content=\"0;url=../\"><a href=../>Docs</a>" > site/$p/docs/index.html
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
